<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday janssss ✨ - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#1a0507] text-[#f3e3b3] font-sans min-h-screen overflow-x-hidden selection:bg-[#dfb15b] selection:text-[#1a0507]">

    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-[#2d0a0e] rounded-full blur-[120px] opacity-60"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-[#4a3b1a] rounded-full blur-[150px] opacity-30"></div>
    </div>

    <main class="relative z-10 flex flex-col items-center min-h-screen p-4 md:p-8 max-w-5xl mx-auto animate-fade-in-up">
        <header class="text-center my-12">
            <h1 class="font-serif text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-[#f3e3b3] via-[#dfb15b] to-[#f3e3b3] drop-shadow-lg">
                Happy Birthday, janssss! 🎉
            </h1>
            <div class="h-px w-32 bg-gradient-to-r from-transparent via-[#dfb15b] to-transparent mx-auto mt-6"></div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full mb-16">
            <!-- Widget 1: Cake Blowout -->
            <div class="luxury-card p-8 flex flex-col items-center justify-center min-h-[350px]">
                <h2 class="font-serif text-xl text-[#dfb15b] mb-8">Make a Wish 🎂</h2>
                <div class="cake-container mb-8 relative">
                    <div class="candle" id="candle"><div class="flame" id="flame"></div></div>
                    <div class="cake-top"></div>
                    <div class="cake-bottom"></div>
                </div>
                <button id="blow-candle-btn" onclick="blowOutCandle()" class="px-6 py-3 rounded-full border border-[#dfb15b] text-[#f3e3b3] hover:bg-[#dfb15b] hover:text-[#1a0507] transition-all font-semibold">
                    🕯️ Blow Out Candle
                </button>
                <p id="wish-message" class="text-center text-sm mt-4 text-[#f3e3b3]/80 hidden opacity-0 transition-opacity duration-1000 max-w-xs">
                    Wish registered! Hope your year is full of 12-hour sleep sessions, zero stress, and top-tier vibes ✨
                </p>
            </div>

            <!-- Widget 2: Evasive Button -->
            <div class="luxury-card p-8 flex flex-col items-center justify-center min-h-[350px] relative overflow-hidden">
                <h2 class="font-serif text-2xl text-[#dfb15b] mb-4 text-center">Ready to check out your birthday vault?</h2>
                <div class="flex gap-4 mt-8 w-full justify-center">
                    <button onclick="goToVault()" class="px-8 py-3 rounded-lg bg-[#dfb15b] text-[#1a0507] font-bold shadow-[0_0_20px_rgba(223,177,91,0.4)] hover:scale-105 transition-transform z-20">
                        YES
                    </button>
                    <button id="no-btn" class="px-8 py-3 rounded-lg border border-[#dfb15b]/50 text-[#f3e3b3] bg-[#2d0a0e] transition-all duration-300 z-10">
                        NO
                    </button>
                </div>
                <p id="evasive-text" class="absolute bottom-6 text-[#dfb15b]/80 h-5 font-script text-xl"></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
