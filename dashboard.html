<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, janssss! 🎉</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <main class="page">
    <div class="container-wide">

      <header class="rise" style="margin-bottom: 2.5rem;">
        <h1 class="h-hero"><span class="gold-text">Happy Birthday, janssss!</span> 🎉</h1>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">

        <!-- Widget 1: CSS cake -->
        <section class="glass card-pad cake-card rise" style="--d: 0.15s;">
          <div class="cake-stage">
            <div class="cake" role="img" aria-label="A birthday cake with a lit candle">
              <div class="cake-plate"></div>
              <div class="layer layer-1"></div>
              <div class="layer layer-2"></div>
              <div class="layer layer-3"></div>
              <div class="candle">
                <span class="flame" id="flame"></span>
                <span class="smoke" id="smoke"></span>
              </div>
            </div>
          </div>

          <button id="blow-btn" type="button" class="btn btn-gold" style="margin-top: 1.4rem;">🕯️ Blow Out Candle</button>
          <p id="wish-text" class="wish-text" aria-live="polite">Wish registered! Hope your year is full of good sleep, zero stress and less classes with Francao✨</p>
        </section>

        <!-- Widget 2: evasive button -->
        <section class="glass card-pad game-card rise" style="--d: 0.3s;">
          <div class="gift-badge" aria-hidden="true"><i class="fa-solid fa-gift"></i></div>
          <h2 class="h-section">Ready for your gifts?</h2>

          <div class="game-buttons">
            <button id="yes-btn" type="button" class="btn btn-gold">YES</button>
            <button id="no-btn" type="button" class="btn btn-ghost btn-evasive">NO</button>
          </div>

          <p id="no-msg" class="no-msg" aria-live="polite"></p>
        </section>

      </div>
    </div>
  </main>
</body>
</html>
