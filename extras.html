<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibes &amp; Favorites 🎁</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <main class="page">
    <div class="container-wide">

      <header class="rise text-center" style="margin-bottom: 2.2rem;">
        <h1 class="h-hero"><span class="gold-text">Vibes &amp; Favorites</span> 🎁</h1>
        <p class="subtle" style="margin: 0.9rem 0 0; font-size: 1.05rem;">Press play, then flip a card</p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">

        <!-- Left: Spotify -->
        <section class="glass spotify-card rise" style="--d: 0.1s;">
          <h2 class="h-section"><i class="fa-brands fa-spotify" aria-hidden="true"></i> Songs that associated with u</h2>
          <div class="spotify-slot">
            <div class="spotify-fallback">
              <i class="fa-brands fa-spotify" aria-hidden="true"></i>
              <span>Your playlist lives here</span>
            </div>
           <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/6ozgs4XN86slyMrbVnpjU9?utm_source=generator&theme=0&si=cab725858f1144d9" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          </div>
        </section>

        <!-- Right: 3D flip cards -->
        <section class="rise" style="--d: 0.25s;">
          <div class="flip-grid">

            <div class="flip-card" tabindex="0" role="button" aria-pressed="false" aria-label="Flip card: tulips">
              <div class="flip-inner">
                <div class="flip-face flip-front">
                  <span class="flip-emoji">🚗</span>
                  <span class="flip-hint">tap to flip</span>
                </div>
                <div class="flip-face flip-back">DONT GO TO BACKSEAT AGAINNNNN</div>
              </div>
            </div>

            <div class="flip-card" tabindex="0" role="button" aria-pressed="false" aria-label="Flip card: sleep">
              <div class="flip-inner">
                <div class="flip-face flip-front">
                  <span class="flip-emoji">💩</span>
                  <span class="flip-hint">tap to flip</span>
                </div>
                <div class="flip-face flip-back">May you have a good shiiit every day</div>
              </div>
            </div>

            <div class="flip-card" tabindex="0" role="button" aria-pressed="false" aria-label="Flip card: lightning">
              <div class="flip-inner">
                <div class="flip-face flip-front">
                  <span class="flip-emoji">🗿</span>
                  <span class="flip-hint">tap to flip</span>
                </div>
                <div class="flip-face flip-back">Say hi to ur 4 husbands </div>
              </div>
            </div>

            <div class="flip-card" tabindex="0" role="button" aria-pressed="false" aria-label="Flip card: water">
              <div class="flip-inner">
                <div class="flip-face flip-front">
                  <span class="flip-emoji">💧</span>
                  <span class="flip-hint">tap to flip</span>
                </div>
                <div class="flip-face flip-back">"getting wet" is goated 🌊</div>
              </div>
            </div>

          </div>
        </section>

      </div>

      <div class="text-center" style="margin-top: 2.5rem;">
        <a href="vault.html" class="btn btn-ghost" data-nav="vault.html">← Back to Vault</a>
      </div>
    </div>
  </main>
</body>
</html>
