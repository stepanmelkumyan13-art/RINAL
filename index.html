<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise for janssss ✨</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <main class="page">
    <div id="lock-card" class="glass lock-card rise">
      <div class="lock-icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></div>

      <h1 class="lock-title">A Special Surprise for u <span class="gold-text">Jans</span> ✨</h1>
      <p class="lock-sub">Enter the secret passcode to unlock 🎂 (Hint: u ALWAYS telling me that to shut up) 4 letters</p>

      <form id="lock-form" autocomplete="off" novalidate>
        <label for="passcode" class="sr-only">Secret passcode</label>
        <div class="input-wrap">
          <input
            id="passcode"
            class="passcode-input"
            type="password"
            placeholder="• • • • •"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="32"
            aria-describedby="lock-error">
          <button type="button" id="eye-btn" class="eye-btn" aria-label="Show passcode">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <p id="lock-error" class="lock-error" role="alert" aria-live="polite"></p>

        <div class="lock-actions">
          <button type="button" id="clear-btn" class="btn btn-ghost">Clear</button>
          <button type="submit" id="unlock-btn" class="btn btn-gold"><i class="fa-solid fa-unlock"></i> Unlock</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
