<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlights 📸</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📸%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <main class="page">
    <div class="container-wide">

      <header class="rise text-center" style="margin-bottom: 2.2rem;">
        <h1 class="h-hero"><span class="gold-text">Highlights</span> 📸</h1>
        <p class="subtle" style="margin: 0.9rem 0 0; font-size: 1.05rem;">Moments worth framing</p>
      </header>

      <!-- To use a real photo, replace the icon inside .polaroid-photo with: <img src="your-photo.jpg" alt="..."> -->
      <div class="polaroid-row">

     <figure class="polaroid rise" style="--rot: -6deg; --d: 0.1s; margin: 0;">
  <div class="polaroid-photo">
    <img src="1.jpeg" alt="Lightning photo" style="width: 100%; height: 100%; object-fit: cover;">
  </div>
  <figcaption class="polaroid-caption">⚡crazy from childhood</figcaption>
</figure>

<figure class="polaroid rise" style="--rot: 3deg; --d: 0.25s; margin: 1.5rem 0 0;">
  <div class="polaroid-photo">
    <img src="2.jpeg" alt="Water photo" style="width: 100%; height: 100%; object-fit: cover; transform: rotate(90deg);">
  </div>
  <figcaption class="polaroid-caption">U better smile but i like this one</figcaption>
</figure>

<figure class="polaroid rise" style="--rot: -3deg; --d: 0.4s; margin: 0;">
  <div class="polaroid-photo">
    <img src="3.jpeg" alt="Bed photo" style="width: 100%; height: 100%; object-fit: cover;">
  </div>
  <figcaption class="polaroid-caption">u gonna steal him?</figcaption>
</figure>


      </div>

      <div class="text-center" style="margin-top: 2.5rem;">
        <a href="vault.html" class="btn btn-ghost" data-nav="vault.html">← Back to Vault</a>
      </div>
    </div>
  </main>
</body>
</html>
