<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault 🎁</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <main class="page">
    <div class="container-wide">

      <header class="rise text-center" style="margin-bottom: 2.8rem;">
        <h1 class="h-hero"><span class="gold-text">Your Birthday Vault</span> 🎁</h1>
        <p class="subtle" style="margin: 0.9rem 0 0; font-size: 1.05rem;">Pick something to open ✨</p>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Card 1: Birthday Note (flower explosion transition) -->
        <div class="rise" style="--d: 0.1s;">
          <button type="button" class="vault-card glass" onclick="triggerFlowerTransition('note.html')">
            <span class="vault-icon" aria-hidden="true"><i class="fa-solid fa-envelope-open-text"></i></span>
            <h2 class="vault-title">A Birthday Note</h2>
            <p class="vault-desc">A little something, written just for you.</p>
          </button>
        </div>

        <!-- Card 2: Highlights -->
        <div class="rise" style="--d: 0.25s;">
          <button type="button" class="vault-card glass" onclick="navigateWithFade('photos.html')">
            <span class="vault-icon" aria-hidden="true"><i class="fa-solid fa-camera-retro"></i></span>
            <h2 class="vault-title">Highlights</h2>
            <p class="vault-desc">Moments worth framing.</p>
          </button>
        </div>

        <!-- Card 3: Vibes & Favorites -->
        <div class="rise" style="--d: 0.4s;">
          <button type="button" class="vault-card glass" onclick="navigateWithFade('extras.html')">
            <span class="vault-icon" aria-hidden="true"><i class="fa-solid fa-gift"></i></span>
            <h2 class="vault-title">Vibes &amp; Favorites</h2>
            <p class="vault-desc">Music, mood, and a few little surprises.</p>
          </button>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
