<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Birthday Vault 🔐</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#1a0507] text-[#f3e3b3] font-sans min-h-screen flex items-center justify-center">
    <div class="w-full max-w-4xl p-6 animate-fade-in-up">
        <h2 class="font-serif text-4xl text-center text-[#dfb15b] mb-12">🔐 Choose a Gift</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Note Button (Triggers Flower Wipe) -->
            <div class="luxury-card p-6 flex flex-col items-center cursor-pointer group hover:scale-[1.02]" onclick="triggerFlowerTransition('note.html')">
                <i class="fa-solid fa-envelope-open-text text-5xl text-[#dfb15b] mb-4"></i>
                <h3 class="font-serif text-xl text-[#dfb15b]">A Birthday Note</h3>
                <p class="text-sm text-[#f3e3b3]/60 mt-2">Open the letter</p>
            </div>

            <!-- Photos Button -->
            <div class="luxury-card p-6 flex flex-col items-center cursor-pointer group hover:scale-[1.02]" onclick="goToPage('photos.html')">
                <i class="fa-solid fa-camera-retro text-5xl text-[#dfb15b] mb-4"></i>
                <h3 class="font-serif text-xl text-[#dfb15b]">Highlights</h3>
                <p class="text-sm text-[#f3e3b3]/60 mt-2">View memories</p>
            </div>

            <!-- Extras Button -->
            <div class="luxury-card p-6 flex flex-col items-center cursor-pointer group hover:scale-[1.02]" onclick="goToPage('extras.html')">
                <i class="fa-solid fa-gift text-5xl text-[#dfb15b] mb-4"></i>
                <h3 class="font-serif text-xl text-[#dfb15b]">Vibes & Favorites</h3>
                <p class="text-sm text-[#f3e3b3]/60 mt-2">Music & more</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
